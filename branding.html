<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projets — Titouan</title>
  <link rel="stylesheet" href="css/style3.css">
</head>
<body>

  <header>
    <div class="header-left">
      <h1>Mes <em>Projets</em></h1>
      <p>Portfolio — Chef de projet digital</p>
    </div>
    <div class="header-right">
      <span class="status-dot"></span>2 en cours
    </div>
  </header>

  <!-- FILTRES -->
  <div class="filters">
    <button class="filter-btn active" onclick="filterProjects('all', this)">Tous</button>
    <button class="filter-btn" onclick="filterProjects('web', this)">Web / Dev</button>
    <button class="filter-btn" onclick="filterProjects('design', this)">Design / UI</button>
    <button class="filter-btn" onclick="filterProjects('gestion', this)">Gestion de projet</button>
  </div>

  <!-- LISTE DES PROJETS -->
  <div class="projects-list" id="grid"></div>

  <!-- INDICATEUR DE DÉFILEMENT -->
  <div class="scroll-hint" id="scrollHint">
    <span>Défiler</span>
    <div class="scroll-hint-arrow"></div>
  </div>

  <script src="ver.js"></script>
</body>
</html>
