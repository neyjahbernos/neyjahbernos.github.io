    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<body>

<div class="page">

  <div class="page-header">
    <h1 class="page-title">Social Design</h1>
  </div>

  <div class="projet-bloc">
    <div class="projet-header">
      <span class="projet-name">Prima scherzo</span>
      <div class="projet-meta-inline">
        <span>Instagram</span>
        <span>2024</span>
      </div>
    </div>

    <!-- Layout 4 colonnes : posts carrés -->
    <div class="projet-grid layout-4">

      <div class="cell ratio-square">
        <!-- <img src="..." alt=""> -->
        <div class="placeholder">Post 1</div>
      </div>

      <div class="cell ratio-square">
        <div class="placeholder">Post 2</div>
      </div>

      <div class="cell ratio-square">
        <div class="placeholder">Post 3</div>
      </div>

      <div class="cell ratio-square">
        <div class="placeholder">Post 4</div>
      </div>

      <div class="cell ratio-square">
        <div class="placeholder">Post 5</div>
      </div>

      <div class="cell ratio-square">
        <div class="placeholder">Post 6</div>
      </div>

      <div class="cell ratio-square">
        <div class="placeholder">Post 7</div>
      </div>

      <div class="cell ratio-square">
        <div class="placeholder">Post 8</div>
      </div>

    </div>
  </div>

  <!-- ════════════════════════════════════
       PROJET 2 — Mix stories + posts
  ════════════════════════════════════ -->
  <div class="projet-bloc">
    <div class="projet-header">
      <span class="projet-name">Agate</span>
      <div class="projet-meta-inline">
        <span>Instagram · Stories</span>
        <span>2024</span>
      </div>
    </div>

    <!-- Layout mixed : stories portrait + post paysage -->
    <div class="projet-grid layout-mixed">

      <div class="cell ratio-portrait">
        <div class="placeholder">Story 1</div>
        <img class="agate1" src="img/agate-post/affiche-pearl-collection.png" alt="">
      </div>

      <div class="cell ratio-portrait">
        <div class="placeholder">Story 2</div>
      </div>

      <div class="cell" style="display:flex; flex-direction:column; gap: var(--gap);">
        <div class="cell ratio-square" style="box-shadow:none; flex:1;">
          <div class="placeholder">Post 1</div>
        </div>
        <div class="cell ratio-square" style="box-shadow:none; flex:1;">
          <div class="placeholder">Post 2</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ════════════════════════════════════
       PROJET 3 — Bannières / affiches
  ════════════════════════════════════ -->
  <div class="projet-bloc">
    <div class="projet-header">
      <span class="projet-name">Regars croisés</span>
      <div class="projet-meta-inline">
        <span>Affiches</span>
        <span>2023</span>
      </div>
    </div>

    <!-- Layout 3 colonnes : affiches portrait -->
    <div class="projet-grid layout-3">

      <div class="cell ratio-post">
        <div class="placeholder">Affiche 1</div>
      </div>

      <div class="cell ratio-post">
        <div class="placeholder">Affiche 2</div>
      </div>

      <div class="cell ratio-post">
        <div class="placeholder">Affiche 3</div>
      </div>

    </div>

    <!-- Bannière pleine largeur en dessous -->
    <div class="projet-grid layout-2">

      <div class="cell ratio-landscape">
        <div class="placeholder">Bannière 1</div>
      </div>

      <div class="cell ratio-landscape">
        <div class="placeholder">Bannière 2</div>
      </div>

    </div>
  </div>

</div>

</body>
