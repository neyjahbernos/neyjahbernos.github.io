<body>

<div class="page">

  <div class="page-header">
    <h1 class="page-title">Social Design</h1>
  </div>

  <!-- ════════════════════════════════
       PROJET 1 — Prima Scherzo
  ════════════════════════════════ -->
  <div class="projet-bloc">
    <div class="projet-header">
      <span class="projet-name">Prima Scherzo</span>
      <div class="projet-meta-inline">
        <span>Instagram</span>
        <span>2024</span>
      </div>
    </div>

    <div class="projet-grid layout-4">
      <div class="cell ratio-square"><div class="placeholder">Post 1</div></div>
      <div class="cell ratio-square"><div class="placeholder">Post 2</div></div>
      <div class="cell ratio-square"><div class="placeholder">Post 3</div></div>
      <div class="cell ratio-square"><div class="placeholder">Post 4</div></div>
      <div class="cell ratio-square"><div class="placeholder">Post 5</div></div>
      <div class="cell ratio-square"><div class="placeholder">Post 6</div></div>
      <div class="cell ratio-square"><div class="placeholder">Post 7</div></div>
      <div class="cell ratio-square"><div class="placeholder">Post 8</div></div>
    </div>
  </div>

  <!-- ════════════════════════════════
       PROJET 2 — Agate
       Col 1 : Story 1 (portrait)
       Col 2 : Story 2 (portrait)
       Col 3 : Post 1 + Post 2 + Post 3 empilés
  ════════════════════════════════ -->
  <div class="projet-bloc">
    <div class="projet-header">
      <span class="projet-name">Agate</span>
      <div class="projet-meta-inline">
        <span>Instagram · Stories</span>
        <span>2024</span>
      </div>
    </div>

    <div class="projet-grid layout-mixed">

      <!-- Story 1 -->
      <div class="cell ratio-portrait">
        <img src="img/agate-post/affiche-pearl-collection.png" alt="Story 1">
      </div>

      <!-- Story 2 -->
      <div class="cell ratio-portrait2 story2">
          <img src="img/agate-post/affiche-BLACKFRIDAY-aghate.png" alt="">
      </div>
      <!-- 3 posts empilés -->
      <div class="cell-stack">
        <div class="cell ratio-landscape video1">
          <img class="video1" src="img/agate-post/miniature-1-youtube.png" alt="Post 1">
        </div>
        <div class="cell ratio-landscape">
          <img class="video2" src="img/agate-post/miniature-2-youtube.png" alt="Post 2">
        </div>
        <div class="cell ratio-landscape">
          <img class="video2" src="img/agate-post/MINIIATURE-3-PHOTOSHOP.png" alt="Post 3">
        </div>
      </div>

    </div>
  </div>

  <!-- ════════════════════════════════
       PROJET 3 — Regards Croisés
  ════════════════════════════════ -->
  <div class="projet-bloc">
    <div class="projet-header">
      <span class="projet-name">Regards Croisés</span>
      <div class="projet-meta-inline">
        <span>Affiches</span>
        <span>2023</span>
      </div>
    </div>

    <div class="projet-grid layout-3">
      <div class="cell ratio-post"><div class="placeholder">Affiche 1</div></div>
      <div class="cell ratio-post"><div class="placeholder">Affiche 2</div></div>
      <div class="cell ratio-post"><div class="placeholder">Affiche 3</div></div>
    </div>

    <div class="projet-grid layout-2">
      <div class="cell ratio-landscape"><div class="placeholder">Bannière 1</div></div>
      <div class="cell ratio-landscape"><div class="placeholder">Bannière 2</div></div>
    </div>
  </div>

</div>

</body>
